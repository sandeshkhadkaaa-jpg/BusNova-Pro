name: Build C WebAssembly and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.73'
      - name: Compile C booking core to browser WebAssembly
        run: |
          emcc src/booking.c -O2 -std=c17 --no-entry \
            -s STANDALONE_WASM=1 \
            -s EXPORTED_FUNCTIONS='["_bn_seat_count","_bn_reset","_bn_status","_bn_import","_bn_reserve","_bn_cancel","_bn_available"]' \
            -o booking.wasm
      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css app.js booking.wasm dist/
          cp -r assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
